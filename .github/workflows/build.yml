name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Recoiless-windows
          path: Recoiless.exe
          if-no-files-found: error
